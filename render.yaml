# Paid web service so database migrations can run before each deploy.
# Render only runs preDeployCommand on paid web services, private services, and workers.
# https://render.com/docs/deploys#pre-deploy-command
# The current smallest paid web plan is 0.5c-512mb.
# https://render.com/docs/web-services
services:
  - type: web
    name: mandate
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandate-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: DEMO_PASSCODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CHANNEL3_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox

databases:
  - name: mandate-db
    databaseName: mandate
    region: oregon
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: web service and one-time local migrate

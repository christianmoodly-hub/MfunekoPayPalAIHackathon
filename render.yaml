# Free web service. This workspace has no payment method, so plan 0.5c-512mb
# fails Blueprint validation with need_payment_info.
# Free web services do not run preDeployCommand.
# https://render.com/docs/deploys#pre-deploy-command
# Migrations run in the build, which still has the drizzle-kit devDependency.
# https://render.com/docs/web-services
# DATABASE_URL is the existing PayPalAgent Postgres instance. A Blueprint cannot
# adopt a database it did not create, so the connection string is entered by hand.
services:
  - type: web
    name: mandate
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: DEMO_PASSCODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CHANNEL3_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
